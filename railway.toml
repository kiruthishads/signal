[build]
dockerfilePath = "backend/Dockerfile"
buildCommand = ""

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[env]
# All environment variables are set in Railway dashboard.
# Required: DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#           SUPABASE_JWT_SECRET, ANTHROPIC_API_KEY, GITHUB_CLIENT_ID,
#           GITHUB_CLIENT_SECRET, FRONTEND_URL
# Set:      ENVIRONMENT=production, DEBUG=false
